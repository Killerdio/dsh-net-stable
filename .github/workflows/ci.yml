name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Offline suite (no network, no dependencies)
        run: node test/run.mjs
      - name: Entry module parses
        run: node -e "import('./index.js').then(m => { if (typeof m.apply !== 'function') process.exit(1) })"
